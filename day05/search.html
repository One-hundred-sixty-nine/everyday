<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색</title>
</head>
<body>
    <header>
        <h1>검색 폼 연습</h1>
    </header>
    <hr>
    <main>
        <h2>내가 만든 검색 폼</h2>
        <br>
        <form
        action="https://www.google.com/search"
        method="get">
            <label
            for="q">구글
        </label>
        <input
        type="text"
        id="q"
        name="q"
        required>
        <button
        type="submit">
            구글에서 검색
        </button>
        </form>
    <br>
    <form
        action="https://ko.wikipedia.org/wiki"
        method="get">
            <label
            for="a">위키백과
        </label>
        <input
        type="text"
        id="a"
        name="search"
        required>
        <button
        type="submit">
            위키백과에서 검색
        </button>
        </form>
        <br>
    </main>
</body>
</html>
